name: Sync upstream

# Keeps master as a pure fast-forward mirror of upstream; this branch only holds this workflow.
# When upstream has new commits, builds master here and publishes a GitHub release.
# The build is trimmed by .github/scripts: 64-bit Unix side only (32-bit games run via WoW64),
# no NVIDIA libraries, and no arm64-only submodules.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if upstream has no new commits'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/GloriousEggroll/proton-ge-custom.git
  BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows.
          # Set SYNC_TOKEN (a PAT with workflow scope) to avoid sync failures in that case.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync with upstream
        id: sync
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream "$BRANCH" --tags --force
          before=$(git rev-parse HEAD)
          git merge --ff-only "upstream/$BRANCH"
          after=$(git rev-parse HEAD)
          echo "sha=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            git push origin "HEAD:$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Synced $before -> $after" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date ($after)" >> "$GITHUB_STEP_SUMMARY"
          fi
          git push origin --tags


  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          # The build needs ~28 GB (sources, build tree, SDK image, ccache).
          # Delete preinstalled toolchains, fastest per GB first, until enough is free.
          need_gb=40
          avail_gb() { df --output=avail -BG / | tail -1 | tr -dc 0-9; }
          echo "Available: $(avail_gb) GB"
          for dir in /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache /usr/share/dotnet \
                     /usr/local/lib/android /opt/microsoft /opt/google /usr/local/share/chromium; do
            [ "$(avail_gb)" -ge "$need_gb" ] && break
            [ -d "$dir" ] || continue
            start=$SECONDS
            sudo rm -rf "$dir"
            echo "Removed $dir in $((SECONDS - start))s, available: $(avail_gb) GB"
          done
          if [ "$(avail_gb)" -lt "$need_gb" ]; then
            docker image prune -af > /dev/null
            echo "Pruned docker images, available: $(avail_gb) GB"
          fi

      - name: Prepare host
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-proton-wow64-${{ github.run_id }}
          restore-keys: |
            ccache-proton-wow64-

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/scripts

      - name: Version
        id: version
        run: echo "name=$(git describe --long --tags)-wow64" >> "$GITHUB_OUTPUT"

      - name: Patch
        run: |
          ./.ci/.github/scripts/fetch-submodules.sh
          ./patches/protonprep-valve-staging.sh || true
          # strip binaries at compile time to save space in the runner
          if [ -f ./.github/patches/0001-build-strip-binaries-early.patch ]; then
            patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          fi
          ./.ci/.github/scripts/optimize.sh
          mkdir ./build

      - name: Configure
        working-directory: ./build
        run: ../configure.sh --build-name=${{ steps.version.outputs.name }} --container-engine=docker

      - name: Make
        working-directory: ./build
        run: make -j$(nproc) WITHOUT_NVIDIA_LIBS=1 redist

      - name: Disk usage
        if: always()
        run: |
          df -h /
          sudo du -sh . ~/.ccache /var/lib/docker 2>/dev/null || true

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ./build/${{ steps.version.outputs.name }}.tar.gz
            ./build/${{ steps.version.outputs.name }}.sha512sum

      - name: Publish release
        working-directory: ./build
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          gh release create "$NAME" "$NAME.tar.gz" "$NAME.sha512sum" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "$NAME" --notes "Automated build of upstream master @ $SHA" \
            || gh release upload "$NAME" "$NAME.tar.gz" "$NAME.sha512sum" --repo "$GITHUB_REPOSITORY" --clobber
